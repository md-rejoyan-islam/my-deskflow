# Release pipeline: push a tag like `v0.1.0` -> build Windows + Linux
# binaries and packages -> publish a GitHub Release with all artifacts.
#
# Design principle: zipped binaries are the reliable baseline and always
# produced. The .deb / .rpm / .msi package steps are best-effort
# (continue-on-error) so a packaging tooling hiccup never blocks the
# always-correct zips. Drop continue-on-error once each is confirmed green.
#
# Trigger:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Build release binaries
        # Produces: inputsync-daemon, inputsync-cli, inputsync-gui
        run: cargo build --release

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package (best-effort, with diagnostics)
        # Bundle all 3 binaries + the systemd user unit. Configured via
        # [package.metadata.deb] in crates/daemon/Cargo.toml. Captured stderr
        # so failures surface in the log; continue-on-error keeps the zip safe.
        continue-on-error: true
        run: |
          cargo deb -p inputsync-daemon --no-build 2>&1
          echo "--- exit: $? ---"
          echo '--- searching for produced .deb ---'
          find target -name '*.deb' 2>/dev/null || echo '(none found)'

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package (best-effort, with diagnostics)
        # Configured via [package.metadata.generate-rpm] in
        # crates/daemon/Cargo.toml. cargo-generate-rpm builds itself, so no
        # --no-build flag here.
        continue-on-error: true
        run: |
          cargo generate-rpm -p crates/daemon 2>&1
          echo "--- exit: $? ---"
          echo '--- searching for produced .rpm ---'
          find target -name '*.rpm' 2>/dev/null || echo '(none found)'

      - name: Stage binaries + packages into a flat dist/ dir
        # Copy binaries + every .deb/.rpm into ONE flat directory so the
        # upload-artifact step produces a flat structure (upload-artifact
        # preserves relative dirs from the least-common-ancestor, so mixing
        # pkg-out/ and target/debian/ would nest the files and break the
        # publish glob). dist/ is also bundled into the tar.gz.
        run: |
          mkdir -p staging dist
          cp target/release/inputsync-daemon staging/
          cp target/release/inputsync-cli  staging/
          cp target/release/inputsync-gui  staging/
          cp packaging/linux/README.md     staging/README-linux.md
          # Collect every .deb/.rpm into both staging (for the tar.gz) and
          # dist/ (flat, for the standalone release assets).
          for f in $(find target -name '*.deb' -o -name '*.rpm' 2>/dev/null); do
            cp -v "$f" staging/
            cp -v "$f" dist/
          done
          echo '--- dist contents ---'
          ls -la dist/ 2>/dev/null || echo 'dist is empty'

      - name: Archive Linux binaries
        run: |
          cd staging
          tar -czf ../inputsync-${{ github.ref_name }}-linux-x86_64.tar.gz *

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v5
        with:
          name: linux-artifacts
          if-no-files-found: ignore
          # Everything flat in dist/ + the tarball at the repo root.
          path: |
            inputsync-*.tar.gz
            dist/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release

      - name: Ensure WiX Toolset v3 is available
        # cargo-wix 0.3.x needs WiX v3 candle.exe/light.exe.
        # windows-latest may already have v3.14.1 pre-installed, so use --force
        # to make choco idempotent (it returns exit 1 if already installed).
        shell: pwsh
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 --no-progress --force
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          $env:PATH = "$wixBin;$env:PATH"
          Write-Host "candle.exe location:"
          (Get-Command candle.exe).Source

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI installer (best-effort, with diagnostics)
        # cargo-wix finds the WiX source at crates/daemon/wix/main.wxs (its
        # default location). --nocapture exposes any candle/light errors.
        # Marked continue-on-error so a packaging miss never blocks the zip.
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host '--- cargo-wix version ---'
          cargo wix --version
          Write-Host '--- target/release contents ---'
          Get-ChildItem target/release -Filter 'inputsync-*.exe' | Format-Table Name, Length
          Write-Host '--- running cargo wix --no-build --nocapture -p inputsync-daemon ---'
          cargo wix --no-build --nocapture -p inputsync-daemon 2>&1
          Write-Host "--- exit code: $LASTEXITCODE ---"
          Write-Host '--- searching for produced .msi everywhere ---'
          Get-ChildItem -Path . -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      - name: Stage binaries + MSI into a flat dist/ dir
        # Copy binaries + the MSI into ONE flat directory so the
        # upload-artifact step produces a flat structure (upload-artifact
        # preserves relative dirs, so msi-out/ vs target/wix/ would nest the
        # files and break the publish glob). dist/ is also bundled into the zip.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item target/release/inputsync-daemon.exe staging/
          Copy-Item target/release/inputsync-cli.exe  staging/
          Copy-Item target/release/inputsync-gui.exe  staging/
          # Collect every .msi into both staging (for the zip) and dist/
          # (flat, for the standalone release asset).
          Get-ChildItem -Path . -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'staging' -and $_.FullName -notmatch 'dist' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination staging/ -Force
              Copy-Item $_.FullName -Destination dist/    -Force
            }
          Write-Host '--- dist contents ---'
          Get-ChildItem -Path dist -ErrorAction SilentlyContinue | Format-Table Name

      - name: Archive Windows binaries
        run: |
          cd staging
          7z a ../inputsync-${{ github.ref_name }}-windows-x86_64.zip *

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v5
        with:
          name: windows-artifacts
          # Don't fail the job if no MSI was produced (best-effort).
          if-no-files-found: ignore
          # Everything flat in dist/ + the zip at the repo root.
          path: |
            inputsync-*.zip
            dist/*

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by softprops/action-gh-release
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        # Debug: confirm every package landed flat under artifacts/.
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Attach every archive and package produced upstream. Globbing is
          # recursive relative to the artifacts dir.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.msi
